function bay(pathId, mau, ms) {
  return new Promise(xong => {
    const p = document.getElementById(pathId), pr = $("#probe"), L = p.getTotalLength(), cs = [...pr.children], t0 = performance.now(), dur = ms / +$("#toc").value;
    pr.setAttribute("opacity", 1);
    cs.forEach(c => c.setAttribute("fill", mau));
    (function buoc(now) {
      const k = Math.min(1, (now - t0) / dur);
      cs.forEach(c => { const i = +c.dataset.i, pt = p.getPointAtLength(Math.max(0, k - i * .025) * L); c.setAttribute("cx", pt.x); c.setAttribute("cy", pt.y); });
      k < 1 ? requestAnimationFrame(buoc) : xong();
    })(t0);
  });
}
function batTram(id, cls) {

}

async function chayThu(ma) {

async function chayKenh(stt, k) {

  let ket = null, xong = 0;
  const so = D.tram.length;
  for (let i = 0; i < so; i++) {
    const t = k.tram[i], T = D.tram[i];
    const loai = t.tt === "xong" ? "x" : t.tt === "cho" ? "v" : (T.den === "xam" ? "d" : "g");
    batTram(T.id, {x: "#39ff88", v: "#ffb020", d: "#ff3355", g: "#5f7891"}[loai]);
    const nhan = {x: "✓ QUA      ", v: "⏳ ĐANG CHỜ", d: "⚠ CHƯA NỐI ", g: "· CHƯA TỚI "}[loai];
    log("T" + so2(T.so), `<span class="${loai}">${nhan}</span> ${esc(T.ten)} <span class="g">▸</span> ${esc(t.chu)}`, loai === "x" ? "x" : loai === "v" ? "v" : loai === "d" ? "d" : "g");
    if (loai === "x") xong++;
    if (loai === "v" && !ket) ket = T;
    await sleep(380);
    if (i < so - 1) await bay("e" + i, ket ? "#ffb020" : "#39ff88", 760);
  }
  if (k.tram[so - 1].tt) { log("SCALE", "⟲ video view cao ⇒ vòng scale quay về T03 CONTENT (viết thêm content win ⇒ thêm lượt quay)", "h"); await bay("es", "#ff2bd6", 1100); batTram("content", "#ff2bd6"); }
  else await bay("e" + (so - 1), "#5f7891", 900);
  log("KẾT", ket ? `<span class="v">SP${esc(stt)} ${esc(k.kenh)} đang chờ ở T${so2(ket.so)} ${esc(ket.ten)}</span> · qua ${xong}/${so} trạm · bước tiếp: <span class="w">${esc(k.buoc)}</span>`

}

async function chayVong() {

    ["scale", "dang", "dung", "quay", "phieu", "content"].forEach(id => (D.tram.find(t => t.id === id).hang || []).slice(0, 25).forEach(h => ung.push(h.stt)));

// nhật ký nền: quét hàng chờ thật (không phải chạy thử)

const NHAN_DEN = {xanh: "ĐANG CHẠY", do: "TẮT", vang: "CHẠY NGẦM", xam: "CHƯA NỐI"};

function soiDoi(cu, moi) {
  if (!cu || cu.luc === moi.luc) return [];
  const doi = [], khoa = h => h.stt + "|" + h.kenh;
  moi.tram.forEach(t => {
    const c = cu.tram.find(x => x.id === t.id), ten = `T${so2(t.so)} ${esc(t.ten)}`;
    if (!c) return;
    let co = false;
    if (c.den !== t.den) { log("TRẠM", `${ten} · ${NHAN_DEN[c.den]} → <span class="w">${NHAN_DEN[t.den]}</span>`, t.den === "xanh" ? "x" : "d"); co = true; }
    if (c.cho !== t.cho) { log("CHỜ", `${ten} · hàng chờ ${c.cho} → <span class="w">${t.cho}</span>`, "v"); co = true; }
    if (c.xong !== t.xong) { log("QUA", `${ten} · đã qua ${c.xong} → <span class="w">${t.xong}</span>`, "x"); co = true; }
    if (c.hang.length < 200 && t.hang.length < 200) {            // danh sách bị cắt ở 200 dòng thì không so được từng mã
      const a = new Set(c.hang.map(khoa)), b = new Set(t.hang.map(khoa)), vao = t.hang.filter(h => !a.has(khoa(h))), ra = c.hang.filter(h => !b.has(khoa(h)));
      vao.slice(0, 3).forEach(h => log("VÀO", `${ten} ▸ SP${esc(h.stt)} ${esc(h.kenh || "")} · ${esc(h.them)}`, "v"));
      ra.slice(0, 3).forEach(h => log("RA", `${ten} ▸ SP${esc(h.stt)} ${esc(h.kenh || "")}`, "x"));
      if (vao.length + ra.length > 6) log("…", `${ten} · tổng ${vao.length} mã vào, ${ra.length} mã ra`, "g");
      co = co || vao.length + ra.length > 0;
    }
    if (co) doi.push(t.id);
  });
  return doi;                                       // 03/11/2026: bỏ dòng SYNC "không có gì đổi", nhường chỗ cho nhật ký thật của các tool
}

// ───── NHẬT KÝ THỜI GIAN THỰC (03/11/2026 đại ca: "tất cả các tác vụ làm gì theo thời gian thực … chạy báo từng dòng,

    const chu = {"font-family": "JetBrains Mono,Consolas,monospace", "text-anchor": "start"};
